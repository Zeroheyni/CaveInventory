# As três functions são chamadas sem JWT do Supabase: os triggers do Postgres
# mandam um segredo compartilhado (x-sync-secret), o painel do mestre manda
# um JWT de usuário (checado à mão em _shared/db.ts:isAuthorized), e o
# Discord manda uma assinatura Ed25519 própria (discord-interactions).
[functions.discord-sync-character]
verify_jwt = false

[functions.discord-sync-public]
verify_jwt = false

[functions.discord-interactions]
verify_jwt = false

[functions.discord-prune]
verify_jwt = false

[functions.discord-cleanup-messages]
verify_jwt = false

[functions.discord-sync-campaign-all]
verify_jwt = false

[functions.discord-notify-turn]
verify_jwt = false

[functions.discord-notify-roll]
verify_jwt = false

# account-admin é chamada pelo app com o JWT do usuário (supabase.functions.invoke). O gateway fica SEM
# verificação de JWT de propósito (a function valida o token com auth.getUser e confere ADM / mestre da
# campanha). Com a verificação ligada o Supabase exige token assinado pelo segredo legado.
[functions.account-admin]
verify_jwt = false
